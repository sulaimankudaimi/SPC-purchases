name: build-windows-exe

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Compare pinned packages against npm view (warn-only)
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const pkgsToCheck = ["electron", "electron-vite", "electron-builder", "playwright", "vitest", "eslint", "prettier"];
            console.log("=== Checking pinned package versions vs latest registry ===");
            for (const p of pkgsToCheck) {
              const pinned = (pkg.devDependencies && pkg.devDependencies[p]) || (pkg.dependencies && pkg.dependencies[p]);
              try {
                const latest = execSync(`npm view ${p} version`, { encoding: "utf8" }).trim();
                if (pinned !== latest) {
                  console.log(`::warning::Package "${p}" pinned at ${pinned}, latest is ${latest}`);
                } else {
                  console.log(`Package "${p}" is up to date (${pinned})`);
                }
              } catch (e) {
                console.log(`::warning::Could not query npm view for ${p}`);
              }
            }
          '

      - name: TypeScript Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Generate assets, fonts, and NSIS icon (assets/icon.ico)
        run: node scripts/generate-assets.mjs

      - name: Run static-config tests (static-config-1 to 4)
        run: npx tsx scripts/run-electron-tests.ts

      - name: Validate Supabase Secrets
        shell: bash
        env:
          PROD_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$PROD_URL" ] || [ -z "$PROD_KEY" ]; then
            echo "::error::PROD_SUPABASE_URL or PROD_SUPABASE_ANON_KEY secret is missing or empty!"
            exit 1
          fi

      - name: Build application bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          VITE_DEV_TOOLS: 'false'

      - name: Run Playwright Electron E2E Tests (Windows GUI — xvfb not needed on Windows)
        shell: bash
        run: |
          echo "### نتائج اختبارات Playwright Electron E2E (Windows GUI — xvfb غير لازمة على ويندوز)" >> $GITHUB_STEP_SUMMARY
          npx playwright test tests/e2e/electron.spec.ts

      - name: Build Windows NSIS Installer (EXE via electron-builder)
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer Artifact (Windows EXE)
        uses: actions/upload-artifact@v4
        with:
          name: SPC-Purchases-Setup-EXE
          path: dist/*.exe
          if-no-files-found: warn
