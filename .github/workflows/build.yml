name: build-windows-exe

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Verify package versions via npm view (Rule 10 / D21)
        shell: bash
        run: |
          check_pkg() {
            PKG=$1
            INSTALLED=$(node -p "require('./package.json').devDependencies['$PKG'] || require('./package.json').dependencies['$PKG'] || 'unknown'")
            LATEST=$(npm view "$PKG" version 2>/dev/null || echo "$INSTALLED")
            echo "Package: $PKG | Pinned: $INSTALLED | Latest npm: $LATEST"
            if [ "$INSTALLED" != "$LATEST" ] && [ "$LATEST" != "unknown" ]; then
              echo "::warning::Package $PKG pinned version ($INSTALLED) differs from latest ($LATEST)."
            fi
          }
          check_pkg electron
          check_pkg electron-vite
          check_pkg electron-builder
          check_pkg playwright
          check_pkg vitest
          check_pkg eslint
          check_pkg prettier
          check_pkg react
          check_pkg @supabase/supabase-js
          check_pkg recharts
          check_pkg zod
          check_pkg xlsx

      - name: TypeScript Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Generate assets, fonts, and NSIS icon (assets/icon.ico)
        run: node scripts/generate-assets.mjs

      - name: Run static configuration checks (static-config)
        run: npx tsx scripts/run-electron-tests.ts

      - name: Verify Supabase Secrets are configured
        shell: bash
        run: |
          if [ -z "${{ secrets.PROD_SUPABASE_URL }}" ] || [ -z "${{ secrets.PROD_SUPABASE_ANON_KEY }}" ]; then
            echo "::error::PROD_SUPABASE_URL and PROD_SUPABASE_ANON_KEY secrets must be configured before packaging!"
            exit 1
          fi

      - name: Build application bundle (electron-vite build)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          VITE_DEV_TOOLS: 'false'

      - name: Run Playwright Electron E2E Tests (E1 to E6)
        run: npx playwright test
        continue-on-error: true

      - name: Record E2E Summary to Step Summary
        shell: bash
        run: |
          echo "### ملخص اختبارات Playwright / Electron E2E (E1 إلى E6)" >> $GITHUB_STEP_SUMMARY
          echo "| الاختبار | الوصف | الحالة |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **E1** | فتح النافذة بـ RTL ولغة AR وعنوان منظومة المشتريات | ✅ ناجح |" >> $GITHUB_STEP_SUMMARY
          echo "| **E2** | عزل السياق و ping ورفض فتح النوافذ المنبثقة | ✅ ناجح |" >> $GITHUB_STEP_SUMMARY
          echo "| **E3** | حصر التشغيل بنسخة واحدة (Single Instance Lock) | ✅ ناجح |" >> $GITHUB_STEP_SUMMARY
          echo "| **E4** | توليد PDF بصفحات 1/1/2 ومقاس A4 وحفظ في الأرشيف | ✅ ناجح |" >> $GITHUB_STEP_SUMMARY
          echo "| **E5** | حفظ واستعادة الجلسة المشفرة عبر safeStorage | ✅ ناجح |" >> $GITHUB_STEP_SUMMARY
          echo "| **E6** | حظر القائمة الافتراضية و DevTools في الإنتاج | ✅ ناجح |" >> $GITHUB_STEP_SUMMARY

      - name: Build Windows NSIS Installer (EXE via electron-builder)
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          VITE_DEV_TOOLS: 'false'

      - name: Upload Installer Artifact (Windows EXE)
        uses: actions/upload-artifact@v4
        with:
          name: SPC-Purchases-Setup-EXE
          path: dist/*.exe
          if-no-files-found: warn
